<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101731"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="960" height="380" rx="16" fill="url(#bg2)"/>
  <text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Latency Budget — End of Speech → First Audio</text>
  <text x="480" y="64" text-anchor="middle" fill="#64748b" font-size="13">the only number that matters · M1 gate: p50 ≤ 2.0 s · final target: 1.5 s</text>

  <!-- scale: 0-2500ms mapped to x=180..900 (0.288 px/ms) -->
  <!-- gate line at 2000ms -->
  <line x1="756" y1="95" x2="756" y2="330" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="764" y="110" fill="#fb7185" font-size="12" font-weight="600">M1 gate · 2.0 s</text>
  <line x1="612" y1="95" x2="612" y2="330" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="110" fill="#34d399" font-size="12" font-weight="600">target · 1.5 s</text>

  <!-- STT: 400ms -> w=115 -->
  <text x="170" y="152" text-anchor="end" fill="#cbd5e1" font-size="13.5" font-weight="600">Whisper STT</text>
  <rect x="180" y="136" width="115" height="24" rx="6" fill="url(#bar)"/>
  <text x="303" y="153" fill="#94a3b8" font-size="12">≈ 0.40 s</text>

  <!-- Router: 100ms -> w=29 -->
  <text x="170" y="192" text-anchor="end" fill="#cbd5e1" font-size="13.5" font-weight="600">Model routing</text>
  <rect x="180" y="176" width="29" height="24" rx="6" fill="#6366f1"/>
  <text x="217" y="193" fill="#94a3b8" font-size="12">≈ 0.10 s</text>

  <!-- LLM first token: 600ms -> w=173 -->
  <text x="170" y="232" text-anchor="end" fill="#cbd5e1" font-size="13.5" font-weight="600">LLM first token</text>
  <rect x="180" y="216" width="173" height="24" rx="6" fill="url(#bar)"/>
  <text x="361" y="233" fill="#94a3b8" font-size="12">≈ 0.60 s</text>

  <!-- TTS first sentence: 700ms -> w=202 -->
  <text x="170" y="272" text-anchor="end" fill="#cbd5e1" font-size="13.5" font-weight="600">TTS first sentence</text>
  <rect x="180" y="256" width="202" height="24" rx="6" fill="url(#bar)"/>
  <text x="390" y="273" fill="#94a3b8" font-size="12">≈ 0.70 s</text>

  <!-- total -->
  <text x="170" y="322" text-anchor="end" fill="#e2e8f0" font-size="14" font-weight="700">Budget total</text>
  <rect x="180" y="306" width="520" height="24" rx="6" fill="none" stroke="#818cf8" stroke-dasharray="4 3"/>
  <text x="708" y="323" fill="#a5b4fc" font-size="12.5" font-weight="700">≈ 1.8 s ✓ under gate</text>

  <text x="480" y="360" text-anchor="middle" fill="#475569" font-size="11">sentence-level TTS streaming means audio starts on the first complete sentence — not after the full reply</text>
</svg>
