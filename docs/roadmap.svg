<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101731"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="960" height="340" rx="16" fill="url(#bg3)"/>
  <text x="480" y="44" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Roadmap — Milestone Gates</text>

  <!-- spine -->
  <line x1="70" y1="150" x2="905" y2="150" stroke="#334155" stroke-width="3"/>

  <!-- M0 -->
  <circle cx="90" cy="150" r="11" fill="url(#done)"/>
  <text x="90" y="120" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">M0</text>
  <text x="90" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">smoke test</text>
  <text x="90" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">staged latency</text>

  <!-- M1 -->
  <circle cx="240" cy="150" r="11" fill="url(#done)"/>
  <text x="240" y="120" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">M1</text>
  <text x="240" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">pipeline speaks</text>
  <text x="240" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">p50 ≤ 2.0 s gate</text>

  <!-- M2 -->
  <circle cx="390" cy="150" r="11" fill="url(#done)"/>
  <text x="390" y="120" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">M2</text>
  <text x="390" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">task-aware router</text>
  <text x="390" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">quota ledger · burn table</text>

  <!-- M3 -->
  <circle cx="540" cy="150" r="11" fill="url(#done)"/>
  <text x="540" y="120" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">M3</text>
  <text x="540" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">tools + safety gate</text>
  <text x="540" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">PC · web · media · notes</text>

  <!-- M4 in progress -->
  <circle cx="690" cy="150" r="11" fill="#0b1020" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 683 150 a 7 7 0 1 1 7 7" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 690 150" to="360 690 150" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <text x="690" y="120" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">M4</text>
  <text x="690" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">presence: memory ✓</text>
  <text x="690" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">wake word · tray · autostart</text>

  <!-- M5 planned -->
  <circle cx="845" cy="150" r="11" fill="#0b1020" stroke="#475569" stroke-width="3"/>
  <text x="845" y="120" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">M5</text>
  <text x="845" y="182" text-anchor="middle" fill="#94a3b8" font-size="11.5">1.5 s push · vision</text>
  <text x="845" y="198" text-anchor="middle" fill="#94a3b8" font-size="11.5">integration day · OSS prep</text>

  <!-- legend -->
  <g transform="translate(300,268)">
    <circle cx="0" cy="0" r="7" fill="url(#done)"/>
    <text x="14" y="4" fill="#94a3b8" font-size="12">gate passed &amp; measured</text>
    <circle cx="210" cy="0" r="7" fill="#0b1020" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="224" y="4" fill="#94a3b8" font-size="12">in progress</text>
    <circle cx="350" cy="0" r="7" fill="#0b1020" stroke="#475569" stroke-width="2.5"/>
    <text x="364" y="4" fill="#94a3b8" font-size="12">planned</text>
  </g>

  <text x="480" y="315" text-anchor="middle" fill="#475569" font-size="11">every milestone ships with a measured eval gate before the next one opens</text>
</svg>
