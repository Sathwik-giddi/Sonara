# Task-aware model routing. Companion to caps.yaml (which holds quota limits).
#
# HOW ROUTING WORKS
#   1. sonara/tasks.py classifies the utterance deterministically (no LLM call).
#   2. For that task, walk `routes` in order and take the first candidate whose
#      provider has a key, has headroom in the ledger, and is not marked
#      exhausted by a live 429.
#   3. Every task ends with a local candidate, so Sonara degrades instead of dying.
#
# EVERY MODEL ID BELOW WAS MEASURED, NOT READ IN A DOC (2026-07-31, this account).
# NVIDIA NIM lists 102 models; a listing is not a promise. Measured on this key:
#   404 (listed, not served) : moonshotai/kimi-k2.6, mistralai/codestral-22b,
#                              deepseek-ai/deepseek-coder-6.7b, meta/codellama-70b
#   TIMEOUT (>25s, unusable) : meta/llama-3.3-70b-instruct (180s!), minimaxai/minimax-m3,
#                              openai/gpt-oss-120b
# Re-verify with: uv run scripts/probe_latency.py
as_of: 2026-07-31

# Measured round-trip for a 40-token reply (not first-token; streaming is faster):
#   495 ms  nvidia/nemotron-3-nano-30b-a3b        * leaks chain-of-thought, see note
#   1,000 ms nvidia/nemotron-3-super-120b-a12b
#   1,428 ms nvidia/nemotron-3-ultra-550b-a55b     <- 550B params, free, 1.4s
#   1,575 ms meta/llama-3.1-8b-instruct
#   1,784 ms nvidia/llama-3.3-nemotron-super-49b-v1.5
#   1,926 ms openai/gpt-oss-20b
#   2,399 ms nvidia/llama-3.3-nemotron-super-49b-v1
#   3,957 ms meta/llama-3.1-70b-instruct
#   5,672 ms deepseek-ai/deepseek-v4-flash
#   9,335 ms deepseek-ai/deepseek-v4-pro          <- too slow for a voice loop
#
# NOTE on nemotron-3-nano-30b-a3b: fastest of the lot, but it emitted its own
# reasoning ("The user asks: ...") into the reply. Sonara SPEAKS these strings, so
# it is kept out of any route whose output goes straight to TTS until we strip
# chain-of-thought. Speed is worthless if the assistant narrates its own thinking.

# NEVER route to NIM ids beginning with "~" (~vendor/model-*, ~openai/gpt-*,
# ~google/gemini-*, ~x-ai/grok-*). Those are proprietary third-party models proxied
# through NIM, not NVIDIA's open weights. They are the most likely thing in the
# catalog to consume paid credits, and $0-forever is a hard constraint (premise 2).
forbidden_prefixes: ["~"]

tiers:
  fast:   [groq]
  deep:   [nvidia_nim, google_ai_studio, openrouter, mistral]
  local:  [ollama_local]

routes:
  # Quick conversation. Speed is the product; Groq measured 281-289ms to first
  # token, which nothing on NIM matches. NIM entry is the keep-alive if Groq dries.
  chat:
    - {provider: groq,         model: llama-3.3-70b-versatile}
    - {provider: nvidia_nim,   model: meta/llama-3.1-8b-instruct}
    - {provider: ollama_local, model: qwen2.5:3b}

  # Tool/function calling: PC control, reminders, media. Correctness of the call
  # beats eloquence - a malformed call is a failed action. Nemotron is here
  # specifically for its OpenAI-format tool calling; v1.5 is the faster revision.
  command:
    - {provider: groq,         model: llama-3.3-70b-versatile}
    - {provider: nvidia_nim,   model: nvidia/llama-3.3-nemotron-super-49b-v1.5}
    - {provider: ollama_local, model: qwen2.5:3b}

  # Planning, comparison, multi-step analysis. THIS is why the deep tier exists:
  # a 550B model answering in 1.4s, free. Routed here even when Groq has headroom,
  # because that is what "switch on the task" means. Deep tier budget is 2.5s.
  reason:
    - {provider: nvidia_nim,   model: nvidia/nemotron-3-ultra-550b-a55b}
    - {provider: nvidia_nim,   model: nvidia/nemotron-3-super-120b-a12b}
    - {provider: groq,         model: llama-3.3-70b-versatile}
    - {provider: ollama_local, model: qwen2.5:3b}

  # Code. Every dedicated coder model on NIM 404s on this account (codestral,
  # deepseek-coder, codellama all listed but not served), so this uses the
  # strongest general models instead. Revisit if NIM starts serving them.
  code:
    - {provider: nvidia_nim,   model: nvidia/nemotron-3-super-120b-a12b}
    - {provider: nvidia_nim,   model: openai/gpt-oss-20b}
    - {provider: groq,         model: llama-3.3-70b-versatile}
    - {provider: ollama_local, model: qwen2.5:3b}

  # Long input, short output. Needs context window, not brilliance - so keep the
  # fast tier and save scarce deep-tier requests for work that needs thinking.
  summarize:
    - {provider: groq,         model: llama-3.3-70b-versatile}
    - {provider: nvidia_nim,   model: nvidia/nemotron-3-super-120b-a12b}
    - {provider: ollama_local, model: qwen2.5:3b}

# Hard ceilings per tier. A voice assistant must never hang: meta/llama-3.3-70b
# on NIM read-timed out at 180s, and the OpenAI client's default is 600s. Anything
# slower than these is treated as a failure and the router moves to the next
# candidate, which is strictly better than silence.
# MEASURED 2026-07-31, and the variance is the point. Repeated SHORT prompts:
#   nemotron-3-ultra-550b : 1,004 / 1,060 / 1,336 ms, 1 outright failure in 4
#   nemotron-3-super-120b : 503 / 546 / 574 ms
# But a genuinely hard prompt ("compare renting vs buying a GPU") took 16,637 ms
# to FIRST TOKEN on the 550B. These are reasoning models: they think before they
# speak, and thinking time scales with the question. For a voice assistant that
# is silence, which is the one thing it cannot do.
# So deep is capped at 10s: past that, fail over to a faster candidate rather
# than let the user sit in silence. Answer quality is worth waiting for; a dead
# microphone is not.
timeouts_s:
  fast:  8
  deep:  10
  local: 30

# End-of-speech -> first-audio budget, PER TIER. A deep-tier answer is allowed to
# be slower because the user asked something worth thinking about; judging a 550B
# reasoning answer against the chat budget would fail a system that is behaving
# exactly as designed. Fast tier: 2.0s is the M1 interim gate, 1.5s the final target.
latency_targets_s:
  fast:  2.0
  deep:  2.5
  local: 4.0
