[project]
name = "sonara"
version = "0.0.1"
description = "Sonara: Windows-first, router-first personal voice assistant at $0. Wake word: Hey Sonara"
readme = "README.md"
# 3.12 pin: faster-whisper/ctranslate2 and onnxruntime wheels lag the newest CPython
requires-python = ">=3.11,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "piper-tts>=1.6.0",
]

[project.optional-dependencies]
# Windows + NVIDIA only. ctranslate2 (faster-whisper's backend) links cuBLAS and
# cuDNN at runtime; without these, STT silently falls back to CPU, which measured
# 1.5s cold and degraded past 7s under sustained load. Install with:
#   uv pip install nvidia-cublas-cu12 nvidia-cudnn-cu12
# scripts/cuda_dlls.py registers them (site-packages is not on Windows' DLL path).
cuda = ["nvidia-cublas-cu12>=12.9", "nvidia-cudnn-cu12>=9.24"]

[tool.uv]
python-preference = "managed"
